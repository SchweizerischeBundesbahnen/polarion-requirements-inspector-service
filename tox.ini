[tox]
# Python version resolved by uv from .tool-versions - no manual update needed
envlist =
    ruff
    mypy
    test

[testenv]
description = run pytest and coverage
runner = uv-venv-lock-runner
package = skip
# uv-venv-lock-runner passes --locked by default. This project depends on
# python-requirements-inspector as a direct URL wheel, whose metadata uv has to
# generate from GitHub on every lock verification, until GitHub answers
# "refused stream before processing any application logic" (#116 -> #115).
# --frozen uses uv.lock as it stands and fetches nothing, and it suppresses the
# implicit --locked. The lock stays in agreement with pyproject.toml through the
# uv lock --check pre-commit hook and through uv sync --locked in ci.yml.
uv_sync_flags = --frozen
dependency_groups =
    dev
    test
commands =
    coverage run -m pytest tests/ --junitxml="junittest.xml" -v
    coverage report -m --fail-under 80
    coverage xml

[testenv:ruff]
description = run ruff linter and formatter
dependency_groups = dev
commands =
    ruff format
    ruff check

[testenv:mypy]
description = run mypy type checker
dependency_groups = dev
commands =
    mypy .

[coverage:run]
relative_files = True
source = app/
branch = True
